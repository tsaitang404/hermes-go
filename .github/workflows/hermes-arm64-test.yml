name: Hermes Go arm64 test APK

on:
  push:
    branches: [ci/hermes-arm64-test-f57482d]
    paths: [.github/workflows/hermes-arm64-test.yml]

permissions:
  contents: read

concurrency:
  group: hermes-go-arm64-test
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'tsaitang404/hermes-go'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DSH_MAVEN_MIRRORS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f57482d3ea3a14f53f64a952e511a48128c95c9f
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Verify sources and prepare Android toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f57482d3ea3a14f53f64a952e511a48128c95c9f
          test ! -e app/android/key.properties
          python3 app/tool/guide_sync.py --check
          python3 app/tool/l10n_merge.py --check
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK not configured}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" 'build-tools;36.0.0' 'platforms;android-36' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > app/android/local.properties
          (cd app && flutter pub get --enforce-lockfile)
          (cd app/android && gradle --no-daemon wrapper --gradle-version 9.3.1)
      - name: Build runtime and debug-signed arm64 APK
        run: |
          set -euo pipefail
          runtime/build-runtime.sh arm64-v8a
          python3 -I tooling/check_runtime_bundle.py arm64
          tooling/build-apk.sh --debug -f arm64 -- --no-pub
      - name: Verify signature, ABI and bundled runtime
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          apk=dist/hermes-go-f57482d-arm64-test.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-debug.apk "$apk"
          signature=$("$sdk_tools/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signature"
          grep -Fq 'CN=Android Debug' <<< "$signature"
          badge=$("$sdk_tools/aapt2" dump badging "$apk")
          grep "^package: name='io.github.ccch1mneyyy.dsh_app'" <<< "$badge"
          grep "^native-code: 'arm64-v8a' *$" <<< "$badge"
          unzip -Z1 "$apk" | grep -Ex 'assets/runtime/rootfs-arm64-v8a\.tar\.xz'
          sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
          stat -c 'APK size: %s bytes' "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hermes-go-f57482d-arm64-test
          path: dist/hermes-go-f57482d-arm64-test.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
